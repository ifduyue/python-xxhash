name: build

on: [push]

jobs:
  build_wheels:
    name: Build ${{ matrix.archs }} ${{ matrix.build }} wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        archs: ["x86_64, i686", "aarch64", "ppc64le", "s390x"]
        build: ["manylinux", "musllinux"]
        include:
          - os: windows-2022
            archs: "AMD64"
          - os: windows-2022
            archs: "x86"
          - os: windows-2022
            archs: "ARM64"
          - os: macos-15-intel
            archs: "x86_64"
          - os: macos-14
            archs: "arm64"

    steps:
      - name: Disable git autocrlf
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'

      - name: Enable PyPy and free-threading
        shell: bash
        run: |
          echo "CIBW_ENABLE=pypy cpython-freethreading" >> "$GITHUB_ENV"

      - name: Enable CPython pre-release wheels
        shell: bash
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
            echo "CIBW_ENABLE=$CIBW_ENABLE cpython-prerelease" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0
        env:
          CIBW_ARCHS: "${{ matrix.archs }}"
          CIBW_BUILD: "${{ matrix.build && '*-' || ''}}${{ matrix.build }}*"
          # 3.14 is built with cibuildwheel 4.3.1 below. 3.2.0 would build it too.
          CIBW_SKIP: "cp314*"

      # cibuildwheel 4.x dropped 3.7, 3.8, and 3.13t. Keep 3.2.0 above for those.
      # 3.14 is skipped on 3.2.0 so this step is the only build of it.
      - name: Build CPython 3.14 and 3.15 wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_ARCHS: "${{ matrix.archs }}"
          CIBW_BUILD: "cp314*${{ matrix.build && '-' || ''}}${{ matrix.build }}* cp315*${{ matrix.build && '-' || ''}}${{ matrix.build }}*"
          # 4.x removed the cpython-freethreading enable flag. 3.14t and 3.15t are built by default.
          CIBW_ENABLE: ""

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.build }}-${{ matrix.archs }}
          path: ./wheelhouse/*.whl


  build_sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -U pip 'setuptools>=45' 'setuptools-scm>=6.2'

      - name: Build sdist
        run: python setup.py build sdist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-dist
          path: dist/*.tar.gz


  upload_test_pypi:
    name: Upload to Test PyPI (${{ matrix.group }})
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.repository == 'ifduyue/python-xxhash' && !startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        group:
          - 1-of-7
          - 2-of-7
          - 3-of-7
          - 4-of-7
          - 5-of-7
          - 6-of-7
          - 7-of-7
    permissions:
      id-token: write
    environment:
      name: test-pypi
      url: https://test.pypi.org/project/xxhash/
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Select this group's distributions
        run: |
          set -euo pipefail
          index=$(( $(echo "${{ matrix.group }}" | cut -d- -f1) - 1 ))
          count=$(echo "${{ matrix.group }}" | cut -d- -f3)
          mkdir -p dist_group
          shopt -s nullglob
          mapfile -t all < <(printf '%s\n' dist/*.whl dist/*.tar.gz | LC_ALL=C sort)
          i=0
          for f in "${all[@]}"; do
            if [ "$(( i % count ))" -eq "${index}" ]; then
              mv -- "$f" dist_group/
            fi
            i=$(( i + 1 ))
          done
          echo "Group ${index} of ${count}: ${#all[@]} dists total, kept $(ls dist_group | wc -l) dist(s)"

      - name: Upload to Test PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist_group
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/

  upload_pypi:
    name: Upload to PyPI (${{ matrix.group }})
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.repository == 'ifduyue/python-xxhash' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        group:
          - 1-of-7
          - 2-of-7
          - 3-of-7
          - 4-of-7
          - 5-of-7
          - 6-of-7
          - 7-of-7
    environment:
      name: pypi
      url: https://pypi.org/project/xxhash/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Select this group's distributions
        run: |
          set -euo pipefail
          index=$(( $(echo "${{ matrix.group }}" | cut -d- -f1) - 1 ))
          count=$(echo "${{ matrix.group }}" | cut -d- -f3)
          mkdir -p dist_group
          shopt -s nullglob
          mapfile -t all < <(printf '%s\n' dist/*.whl dist/*.tar.gz | LC_ALL=C sort)
          i=0
          for f in "${all[@]}"; do
            if [ "$(( i % count ))" -eq "${index}" ]; then
              mv -- "$f" dist_group/
            fi
            i=$(( i + 1 ))
          done
          echo "Group ${index} of ${count}: ${#all[@]} dists total, kept $(ls dist_group | wc -l) dist(s)"

      - name: Upload to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist_group
          skip-existing: true
