name: test

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - windows-2022
          - windows-2025
          - windows-11-arm
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.14t"
          - "pypy3.9"
          - "pypy3.10"
          - "pypy3.11"
        exclude:
          # CPython Windows ARM64 installers start at 3.11; PyPy has no win-arm64 builds.
          - os: windows-11-arm
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.10"
          - os: windows-11-arm
            python-version: "pypy3.9"
          - os: windows-11-arm
            python-version: "pypy3.10"
          - os: windows-11-arm
            python-version: "pypy3.11"
          # setup-python has no Python 3.9 builds for Ubuntu 26.04.
          - os: ubuntu-26.04
            python-version: "3.9"
          - os: ubuntu-26.04
            python-version: "pypy3.9"
          - os: ubuntu-26.04-arm
            python-version: "3.9"
          - os: ubuntu-26.04-arm
            python-version: "pypy3.9"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -U pip 'setuptools>=45' pytest pyright

      - name: Build and run tests
        run: |
          python setup.py build_ext --inplace
          python -m unittest discover -vv tests

      - name: Run benchmarks
        shell: bash
        run: ./bench.sh

  test_s390x:
    name: Test on big-endian s390x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run tests on s390x
        uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9 # v3.1.0
        with:
          arch: s390x
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y python3 python3-pip build-essential
          run: |
            python3 -c "import sys; assert sys.byteorder == 'big'; print('byteorder:', sys.byteorder)"
            python3 -m pip install --upgrade uv
            uvx --python cpython@3.12 --with setuptools python setup.py build_ext --inplace
            uvx --python cpython@3.12 --with pytest,pyright python -m unittest discover -vv tests
