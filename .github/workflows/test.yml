name: test

on: [push, pull_request]

jobs:
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - windows-2022
          - windows-2025
          - windows-11-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Test all Python versions
        shell: bash
        env:
          OS_NAME: ${{ matrix.os }}
        run: |
          set -euo pipefail
          versions=(3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.9 pypy3.10 pypy3.11)
          case "$OS_NAME" in
            windows-11-arm)
              # Native Windows ARM64 CPython starts at 3.11. 3.9/3.10/PyPy run
              # as x86_64 under Windows on ARM emulation (uv's default on WoA).
              versions=(
                3.9-x86_64 3.10-x86_64
                3.11-aarch64 3.12-aarch64 3.13-aarch64 3.13t-aarch64
                3.14-aarch64 3.14t-aarch64
                pypy3.9 pypy3.10 pypy3.11
              )
              ;;
            ubuntu-26.04|ubuntu-26.04-arm)
              # setup-python/uv have no Python 3.9 builds for Ubuntu 26.04.
              versions=(3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.10 pypy3.11)
              ;;
          esac

          fmt_duration() {
            local s=$1
            if [ "$s" -ge 60 ]; then
              printf '%dm%02ds' $((s / 60)) $((s % 60))
            else
              printf '%ds' "$s"
            fi
          }

          job_start=$(date +%s)
          echo "::group::Install Python versions"
          install_start=$(date +%s)
          uv python install "${versions[@]}"
          install_elapsed=$(( $(date +%s) - install_start ))
          echo "Install: $(fmt_duration "$install_elapsed")"
          echo "::endgroup::"

          failed=()
          names=()
          statuses=()
          times=()
          for ver in "${versions[@]}"; do
            echo "::group::Python ${ver}"
            start=$(date +%s)
            rm -rf build
            rm -f xxhash/_xxhash*.so xxhash/_xxhash*.pyd
            if uvx --python "$ver" --with 'setuptools>=45' python setup.py build_ext --inplace \
              && uvx --python "$ver" --with pytest,pyright python -m unittest discover -vv tests; then
              status=OK
            else
              status=FAIL
              failed+=("$ver")
            fi
            elapsed=$(( $(date +%s) - start ))
            echo "Python ${ver}: ${status} in $(fmt_duration "$elapsed")"
            echo "::endgroup::"
            echo "Python ${ver}: ${status} in $(fmt_duration "$elapsed")"
            names+=("$ver")
            statuses+=("$status")
            times+=("$elapsed")
          done

          job_elapsed=$(( $(date +%s) - job_start ))
          echo
          echo "Timings"
          printf '%-22s %-6s %8s\n' "Step" "Status" "Time"
          printf '%-22s %-6s %8s\n' "install" "OK" "$(fmt_duration "$install_elapsed")"
          i=0
          while [ "$i" -lt "${#names[@]}" ]; do
            printf '%-22s %-6s %8s\n' "${names[$i]}" "${statuses[$i]}" "$(fmt_duration "${times[$i]}")"
            i=$((i + 1))
          done
          printf '%-22s %-6s %8s\n' "total" "" "$(fmt_duration "$job_elapsed")"

          {
            echo "### Python test times"
            echo
            echo "| Step | Status | Time |"
            echo "| --- | --- | ---: |"
            echo "| install | OK | $(fmt_duration "$install_elapsed") |"
            i=0
            while [ "$i" -lt "${#names[@]}" ]; do
              echo "| ${names[$i]} | ${statuses[$i]} | $(fmt_duration "${times[$i]}") |"
              i=$((i + 1))
            done
            echo "| **total** | | **$(fmt_duration "$job_elapsed")** |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed Python versions: ${failed[*]}" >&2
            exit 1
          fi

      - name: Run benchmarks
        shell: bash
        env:
          OS_NAME: ${{ matrix.os }}
        run: |
          set -euo pipefail
          bench_py=3.14
          if [[ "$OS_NAME" == windows-11-arm ]]; then
            bench_py=3.14-aarch64
          fi
          rm -rf build
          rm -f xxhash/_xxhash*.so xxhash/_xxhash*.pyd
          uvx --python "$bench_py" --with 'setuptools>=45' python setup.py build_ext --inplace
          py="$(uv python find "$bench_py")"
          if command -v cygpath >/dev/null 2>&1; then
            py="$(cygpath -u "$py")"
          fi
          PYTHON="$py" ./bench.sh

  test_s390x:
    name: Test on big-endian s390x
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Run tests on s390x
        uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9 # v3.1.0
        with:
          arch: s390x
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -q -y python3 python3-pip build-essential
          run: |
            python3 -c "import sys; assert sys.byteorder == 'big'; print('byteorder:', sys.byteorder)"
            python3 -m pip install --upgrade uv
            uvx --python cpython@3.12 --with setuptools python setup.py build_ext --inplace
            uvx --python cpython@3.12 --with pytest,pyright python -m unittest discover -vv tests
